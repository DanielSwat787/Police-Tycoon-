<style>:root{--azul:#0d1b2a;--azul2:#1b3a5c;--ouro:#f2b705;--txt:#e8eef4;--borda:#2c4a6b}

button:disabled{opacity:.4;cursor:default}
#menu button{flex:1;font-size:12px;font-weight:600;padding:10px 4px}
.destaque{background:var(--ouro);color:#1a1a1a;border-color:var(--ouro);font-weight:700}

#p-corpo{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}

<script>
const U = {
  rr(c, x, y, w, h, r) {
    c.beginPath();
    if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h);
  },
  hash(a, b) {
    let h = (a * 374761393 + b * 668265263) ^ 0x5bd1e995;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  },
  brl(v) { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
};

</script>
<script>
const Salvamento = {
  chave: 'policetycoon_v1',
  salvar(estado) {
    try { localStorage.setItem(this.chave, JSON.stringify(estado)); return true; } catch (_) { return false; }
  },
  carregar() {
    try { const s = localStorage.getItem(this.chave); return s ? JSON.parse(s) : null; } catch (_) { return null; }
  },
  existe() {
    try { return !!localStorage.getItem(this.chave); } catch (_) { return false; }
  },
  apagar() {
    try { localStorage.removeItem(this.chave); } catch (_) {}
  }
};

</script>
<script>
const Financeiro = {
  calcularSalarios(e) {
    return e.funcionarios
      .filter(p => p.tipo === 'funcionario')
      .reduce((total, p) => total + (
        p.especialidade === 'Detetive' ? 220 :
        p.patente === 'SGT' ? 180 :
        p.funcao === 'Guarda Civil' ? 70 :
        p.funcao === 'Operador BOPE' ? 200 :
        p.patente === 'P1' || p.patente === 'P2' ? 160 : 100
      ), 0);
  },
  gastar(e, valor, motivo, forcar) {
    valor = Math.max(0, Number(valor) || 0);
    e.dinheiro = Math.max(0, Number(e.dinheiro) || 0);
    if (e.dinheiro < valor && !forcar) return false;
    const cobrado = Math.min(e.dinheiro, valor);
    e.dinheiro -= cobrado;
    e.despesas = (e.despesas || 0) + cobrado;
    if (cobrado > 0) this._registrar(e, 'despesa', cobrado, motivo);
    return true;
  },
  receber(e, valor, motivo) {
    valor = Math.max(0, Number(valor) || 0);
    e.dinheiro = Math.max(0, Number(e.dinheiro) || 0) + valor;
    e.receitas = (e.receitas || 0) + valor;
    this._registrar(e, 'receita', valor, motivo);
  },
  tick(e, dt) {
    e.dinheiro = Math.max(0, Number(e.dinheiro) || 0);
    e.proxSalario -= dt;
    if (e.proxSalario <= 0) {
      e.proxSalario += 60;
      this.gastar(e, this.calcularSalarios(e), 'Salários', true);
    }
    e.proxCusto -= dt;
    if (e.proxCusto <= 0) {
      e.proxCusto += 30;
      if (e.presos.length) this.receber(e, e.presos.length * 15, 'Receita de custódia dos presos');
    }
    for (const p of e.presos) p.restante -= dt;
    e.presos = e.presos.filter(p => p.restante > 0);
  },
  _registrar(e, tipo, valor, motivo) {
    e.lancamentos.unshift({ tipo, valor, motivo });
    if (e.lancamentos.length > 50) e.lancamentos.length = 50;
  }
};

</script>

      if (window.__desenharSalaGCM && e.salas && e.salas.gcm) window.__desenharSalaGCM(c, e, t);
      if (window.__desenharSalaBOPE && e.salas && e.salas.bope) window.__desenharSalaBOPE(c, e, t);
      e.viaturas.forEach((v, i) => {
        const sx = 13.8 + (i % 3) * 2.8, sy = 10.45 + Math.floor(i / 3) * 1.1;

          Cidade.carro(c, sx * T, sy * T, -Math.PI / 2, 68, false, t, v.modelo);
        }

          c.save(); c.translate(x, y); c.strokeStyle = '#263238'; c.lineWidth = 4;
          c.globalAlpha = abertura;
          c.beginPath(); c.moveTo(-13, -13); c.lineTo(-13 - 15 * abertura, -22); c.stroke();
          c.beginPath(); c.moveTo(-13, 13); c.lineTo(-13 - 15 * abertura, 22); c.stroke();
          c.restore();
        }
      });
      const saida = e.viaturas.reduce((m,v)=>Math.max(m, v.animacaoSaida ? (v.animacaoSaida.fase==='portao' ? Math.min(1,v.animacaoSaida.t/1.2) : v.animacaoSaida.fase==='portas' ? 0.25 : 0) : 0),0);
      c.save();
      c.fillStyle = '#263238'; c.fillRect(13 * T, 13 * T - 5 - saida * 38, 8.2 * T, 7);
      for (let i = 0; i < 41; i++) { c.fillStyle = i % 2 ? '#212121' : '#f2b705'; c.fillRect(13 * T + i * 8, 13 * T - 4 - saida * 38, 8, 7); }
      c.restore();
      const pr = R.prisao;

        const x = (pr.x + 0.65 + (i % 5) * 0.9) * T, y = (pr.y + 1.05 + Math.floor(i / 5) * 1.35) * T;
        c.fillStyle = '#ef6c00'; c.beginPath(); c.ellipse(x, y + 2, 7, 5, 0, 0, 7); c.fill();
        c.fillStyle = PELE[i % 5]; c.beginPath(); c.arc(x, y - 1, 4, 0, 7); c.fill();
      });
      c.fillStyle = 'rgba(13,27,42,.85)'; U.rr(c, (pr.x + pr.w) * T - 46, pr.y * T + 6, 40, 18, 9); c.fill();
      c.fillStyle = '#fff'; c.font = 'bold 11px sans-serif'; c.textAlign = 'center'; c.fillText(e.presos.length + '/' + e.celas, (pr.x + pr.w) * T - 26, pr.y * T + 19);
      const lista = e.funcionarios.filter(p => !p.fora && p.x !== undefined).sort((a, b) => a.y - b.y);
      for (const p of lista) pessoa(c, p, t, PT.sel === p.id);
    },
    tocar(wx, wy, e) {
      const tx = wx / T, ty = wy / T;
      for (const p of e.funcionarios) if (!p.fora && Math.hypot(p.x - tx, p.y - ty) < 0.6) { PT.sel = p.id; return p.nome + ' — ' + p.funcao; }
      const k = roomAt(tx, ty);
      const cmt = e.funcionarios.find(p => p.tipo === 'comandante');
      if (k) { return R[k].n + ' — toque em uma opção de gestão para administrar esta sala. O comandante só se desloca quando receber uma ordem explícita.'; }
      if (tx >= LOTE.x && tx < LOTE.x + LOTE.w && ty >= LOTE.y && ty < LOTE.y + LOTE.h) return 'Terreno vazio, disponível para construção.';
      return '';
    },
    centralizar(p) { return { x: p.x * T, y: p.y * T }; }
  };

<script>

(() => {

  function novoEstado() {

  // ---------- canvas / câmera ----------

    const w = cv.clientWidth, h = cv.clientHeight, z = Math.min(w / m.W, h / m.H) * 0.96;

  }
  function redimensionar() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;

  }
  function zoomEm(px, py, f) {
    const c = PT.cam[PT.view], nz = Math.max(0.12, Math.min(3.5, c.z * f)); f = nz / c.z;
    c.x = px - (px - c.x) * f; c.y = py - (py - c.y) * f; c.z = nz; c.tocada = true;
  }
  const ptrs = new Map(); let mov = 0, pinch = 0;
  const dist = () => { const a = [...ptrs.values()]; return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); };
  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    mov = 0; if (ptrs.size === 2) pinch = dist();
  });
  cv.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    const c = PT.cam[PT.view];
    if (ptrs.size === 1) {
      const dx = e.clientX - p.x, dy = e.clientY - p.y; c.x += dx; c.y += dy; mov += Math.abs(dx) + Math.abs(dy); c.tocada = true;
      p.x = e.clientX; p.y = e.clientY;
    } else {
      p.x = e.clientX; p.y = e.clientY;
      const a = [...ptrs.values()], r = cv.getBoundingClientRect(), nd = dist();
      zoomEm((a[0].x + a[1].x) / 2 - r.left, (a[0].y + a[1].y) / 2 - r.top, nd / pinch); pinch = nd; mov += 10;
    }
  });
  const fim = e => {
    if (!ptrs.has(e.pointerId)) return;
    if (ptrs.size === 1 && mov < 8 && e.type === 'pointerup') tocar(e);
    ptrs.delete(e.pointerId);
  };
  cv.addEventListener('pointerup', fim); cv.addEventListener('pointercancel', fim);
  cv.addEventListener('wheel', e => { e.preventDefault(); zoomEm(e.offsetX, e.offsetY, e.deltaY < 0 ? 1.1 : 0.9); }, { passive: false });
  function tocar(e) {
    const r = cv.getBoundingClientRect(), c = PT.cam[PT.view];
    const msg = MODS[PT.view].tocar((e.clientX - r.left - c.x) / c.z, (e.clientY - r.top - c.y) / c.z, PT.estado);
    if (msg) toast(msg);
  }
  let tt; function toast(m) { const t = $('#toast'); t.textContent = m; if (window.__log) window.__log(m); t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); }

  // ---------- visões ----------

  // ---------- HUD e painéis ----------

  const nomePorId = id => (PT.estado.funcionarios.find(p => p.id === id) || {}).nome || id;
  function htmlGerenciamento() {

      e.viaturas.map(q => '<div class="cartao"><h3>Viatura ' + q.id + ' · ' + (q.nomeModelo||q.modelo) + '</h3><div class="linha"><span>Situação</span><b>' + q.estado + '</b></div>' +

      '<div class="linha"><span>Rondas concluídas</span><span>' + (q.patrulhas||0) + '</span></div>' +
      '<div class="acoes">' + (q.estado==='Disponível'?'<button data-enviar-vtr="'+q.id+'" '+(q.manutencao<20?'disabled':'')+'>🚓 Enviar para patrulha</button>':'') +
      (q.estado==='Em patrulha'?'<button data-recolher-vtr="'+q.id+'">↩ Recolher viatura</button>':'') +
      (q.estado==='Disponível'&&q.manutencao<100?'<button data-manter-vtr="'+q.id+'">🔧 Manutenção (R$ 400)</button>':'') + '</div></div>').join('');
  }
  function htmlFuncionarios() {
    return PT.estado.funcionarios.map(p => {
      const rec = p.tipo === 'recruta';

        '<div class="linha"><span>' + p.funcao + '</span><span>' + (rec ? 'Etapa ' + (p.etapa + 1) + '/6: ' + Funcionarios.etapas[p.etapa] : p.situacao) + '</span></div>' +
        '<small>📍 ' + (p.local || '-') + ' · ' + (p.atividade || '-') + '</small>' +
        (rec ? '<div class="etapas">' + Funcionarios.etapas.map((_, i) => '<i class="' + (i <= p.etapa ? 'ok' : '') + '"></i>').join('') + '</div>' : '') + '</div>';
    }).join('');

  function htmlOcorrencias() {

<div id="exp-fundo"></div>
<aside id="exp-painel" aria-label="Sistemas avançados do Police Tycoon">
  <div class="exp-topo"><h2 id="exp-titulo">Sistemas do Police Tycoon</h2><button id="exp-fechar">Fechar ✕</button></div>
  <div id="exp-conteudo"></div>
</aside>
<nav id="exp-menu">
  <button data-exp="instalacoes">🏗️ Instalações</button>
  <button data-exp="frota">🚓 Frota</button>
  <button data-exp="equipe">👥 Contratações</button>
  <button data-exp="bairros">🏙️ Bairros</button>
  <button data-exp="relatorios">📊 Análises</button>
</nav>
<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  function aviso(m) { const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(aviso._t); aviso._t=setTimeout(()=>t.classList.remove('on'),2400); }
  function atualizarHud() { const e=PT.estado; if(!e)return; $('#h-saldo').textContent=U.brl(e.dinheiro); $('#h-func').textContent=e.funcionarios.filter(p=>p.tipo==='funcionario').length; $('#h-rec').textContent=e.funcionarios.filter(p=>p.tipo==='recruta').length; $('#h-estado').textContent=e.estadoDelegacia; const n=(e.ocorrencias||[]).filter(o=>o.estado==='aberta').length; $('#badge').textContent=n?'('+n+')':''; }
  const painel = $('#exp-painel'), fundo = $('#exp-fundo'), conteudo = $('#exp-conteudo');
  let aba = 'instalacoes';
  const ehTrein = p => p.tipo === 'funcionario' && p.funcao === 'Policial' && p.patente === 'P1';
  const nomesBairros = ['Centro', 'Jardim das Flores', 'Vila Nova', 'Distrito Industrial', 'Distrito Fabril'];
  const custosBase = {
    recepcao: 1800, gabinete: 2200, adm: 2000, alojamento: 2600,
    refeitorio: 1700, garagem: 3200, prisao: 3500, treinoArmas: 4200, treinoManual: 3000, treinoLuta: 3800, labirinto: 4800
  };
  const nomesSalas = {
    recepcao:'Recepção', gabinete:'Gabinete', adm:'Administração',
    alojamento:'Alojamento', refeitorio:'Refeitório', garagem:'Garagem', prisao:'Custódia', treinoArmas:'Treino de armas', treinoManual:'Treino de manual', treinoLuta:'Sala de luta', labirinto:'Sala de Labirinto'
  };
  const dinheiro = n => U.brl(n);
  const card = (titulo, corpo) => `<section class="exp-card"><h3>${titulo}</h3>${corpo}</section>`;
  const linha = (a,b) => `<div class="exp-linha"><span>${a}</span><b>${b}</b></div>`;
  function preparar(e) {
    e.melhorias = e.melhorias || {};
    for (const k of Object.keys(custosBase)) e.melhorias[k] = Math.max(1, e.melhorias[k] || 1);
    e.bairros = e.bairros || {
      'Centro':{seguranca:62,atividade:70,atendimentos:0},
      'Jardim das Flores':{seguranca:72,atividade:48,atendimentos:0},
      'Vila Nova':{seguranca:55,atividade:58,atendimentos:0},
      'Distrito Industrial':{seguranca:66,atividade:42,atendimentos:0},
      'Distrito Fabril':{seguranca:18,atividade:84,atendimentos:0}
    };
    e.bairros['Distrito Fabril'] = e.bairros['Distrito Fabril'] || {seguranca:18,atividade:84,atendimentos:0};
    e.proximoFuncionario = e.proximoFuncionario || 1;
    e.proximaViatura = e.proximaViatura || (e.viaturas.length + 1);
    e.historicoGeral = e.historicoGeral || [];
    e.ultimoRelatorio = e.ultimoRelatorio || 0;
    e.treinamentos = e.treinamentos || {};
    if (!e.formacao || e.formacao.versao !== 2) {
      // Migração: limpa posições/filas antigas que colocavam sprites uns sobre os outros.
      // Recrutas ainda não formados reiniciam os módulos incompletos; formados são preservados.
      for (const p of e.funcionarios) {
        p.treinoSala = null; p.treinoAnim = null; p.treinoPapel = null; p.treinoFilaEtapa = null; p._filaPos = null;
        if (p.tipo === 'recruta' && (p.moduloTreino || 0) < 3) { p.moduloTreino = 0; p.etapa = 0; }
      }
      e.formacao = { versao:2, rodando:false, filas:{armas:[],manual:[],luta:[]}, ativos:{armas:null,manual:null,luta:null}, instrutores:[] };
    }
    e.formacao.filas = e.formacao.filas || {armas:[],manual:[],luta:[]};
    e.formacao.ativos = e.formacao.ativos || {armas:null,manual:null,luta:null};
    e.formacao.instrutores = e.formacao.instrutores || [];
    e.formacao.rodando = !!e.formacao.rodando;
    for (const p of e.funcionarios.filter(x=>x.tipo==='recruta')) if (p.moduloTreino===undefined) p.moduloTreino=0;
    e.viaturas = e.viaturas || [];
    // Corrige equipes antigas: cada policial só pode estar vinculado a uma viatura.
    const vinculados = new Set();
    for (const v of e.viaturas) {
      v.equipe = Array.isArray(v.equipe) ? v.equipe.filter(id => {
        if (vinculados.has(id)) return false;
        vinculados.add(id); return true;
      }) : [];
      v.animacaoSaida = v.animacaoSaida || null;
    }
    e.presos = e.presos || [];
    e.stats = e.stats || {presos:0,fugiram:0,expiradas:0};
  }
  function registrar(e, msg) {
    e.historicoGeral.unshift({tempo:e.tempo || 0, texto:msg});
    if (e.historicoGeral.length > 40) e.historicoGeral.length = 40;
  }
  function custoMelhoria(e,k) {
    return Math.round(custosBase[k] * Math.pow(e.melhorias[k], 1.65));
  }
  function abrir(nome) {
    if (!PT.estado) return;
    preparar(PT.estado);
    aba = nome;
    $('#exp-titulo').textContent = ({
      instalacoes:'🏗️ Instalações e melhorias',
      frota:'🚓 Gestão da frota',
      equipe:'👥 Equipe e formação',
      bairros:'🏙️ Situação dos bairros',
      relatorios:'📊 Análises da unidade'
    })[nome] || 'Police Tycoon';
    render();
    painel.classList.add('aberto'); fundo.classList.add('aberto');
  }
  function fechar() { painel.classList.remove('aberto'); fundo.classList.remove('aberto'); }
  function renderInstalacoes(e) {
    return Object.keys(custosBase).map(k => {
      const nivel=e.melhorias[k], custo=custoMelhoria(e,k);
      const efeito = k==='prisao' ? `Capacidade de custódia: ${e.celas} vagas` :
        k==='alojamento' ? `Capacidade de alojamento ampliada` :
        k==='garagem' ? `Apoio à manutenção e à frota` :
        k==='adm' ? `Organização administrativa aprimorada` :
        k==='recepcao' ? `Atendimento ao público aprimorado` :
        k==='gabinete' ? `Coordenação e comando aprimorados` :
        k==='refeitorio' ? `Condições de descanso aprimoradas` :
        k==='treinoArmas' ? `Simulações técnicas abstratas e avaliação de segurança` :
        k==='treinoManual' ? `Estudo de normas, procedimentos e avaliação teórica` :
        k==='treinoLuta' ? `Condicionamento e prática esportiva supervisionada` :
        k==='labirinto' ? `Desafio de orientação e memória espacial para a equipe` : `Instalação aprimorada`;
      return card(nomesSalas[k], `${linha('Nível atual',nivel)}${linha('Próxima melhoria',dinheiro(custo))}<p class="exp-muted">${efeito}. Cada melhoria aumenta o nível operacional da sala.</p><button data-melhorar="${k}">Melhorar instalação</button>`);
    }).join('');
  }
  function renderFrota(e) {
    const modelos=[
      ['sedan','Sedan policial',12000,'Viatura urbana equilibrada'],
      ['suv','SUV policial',16500,'Maior porte e presença visual'],
      ['van','Van de apoio',19000,'Veículo de apoio operacional'],
      ['pickup','Picape',17500,'Apoio a áreas periféricas e industriais'],
      ['moto','Motopatrulha',9500,'Veículo compacto para deslocamentos urbanos']
    ];
    const catalogo=modelos.map(([id,nome,custo,desc])=>card(nome,`${linha('Preço',dinheiro(custo))}<p class="exp-muted">${desc}</p><button data-comprar-viatura="${id}" ${e.dinheiro<custo?'disabled':''}>Comprar ${nome}</button>`)).join('');
    const lista=e.viaturas.map(v => card(`🚓 ${v.id} · ${v.nomeModelo||v.modelo||'Sedan'}`,
      `${linha('Situação',v.estado)}${linha('Condição',v.manutencao+'%')}${linha('Patrulhas concluídas',v.patrulhas||0)}${linha('Equipe', (v.equipe||[]).map(id=>(e.funcionarios.find(p=>p.id===id)||{nome:id}).nome).join(', ')||'Não definida')}
      <div class="exp-barra"><i style="width:${Math.max(0,Math.min(100,v.manutencao))}%"></i></div>
      <button data-patrulha="${v.id}" ${v.estado!=='Disponível'||v.manutencao<20?'disabled':''}>Iniciar patrulha geral</button>
      <button data-patrulha-fabril="${v.id}" ${v.estado!=='Disponível'||v.manutencao<20?'disabled':''}>Patrulhar Distrito Fabril</button>
      <button data-recolher="${v.id}" ${v.estado!=='Em patrulha'?'disabled':''}>Recolher</button>
      <button data-manter="${v.id}" ${v.estado!=='Disponível'||v.manutencao>=100?'disabled':''}>Manutenção (R$ 400)</button>`)).join('');
    return card('Catálogo de viaturas',catalogo)+(lista || card('Frota','Nenhuma viatura cadastrada.'));
  }
  function renderEquipe(e) {
    const policiais=e.funcionarios.filter(p=>p.tipo==='funcionario' && (p.funcao==='Policial'||p.funcao==='Comandante')).length;
    const recrutas=e.funcionarios.filter(p=>p.tipo==='recruta');
    const nomes={armas:'Treino de armas',manual:'Treino de manual',luta:'Sala de luta'};
    const etapas=['Treino de armas','Treino de manual','Sala de luta'];
    const fila = Object.entries(e.formacao.filas).map(([k,q])=>`${nomes[k]}: ${q.length} na fila`).join('<br>');
    const ativos = Object.entries(e.formacao.ativos).map(([k,a])=>`${nomes[k]}: ${a?(e.funcionarios.find(p=>p.id===a.id)||{nome:a.id}).nome:'Livre'}`).join('<br>');
    const lista=recrutas.map(p=>{
      const atual=p.moduloTreino||0, emFila=Object.values(e.formacao.filas).some(q=>q.includes(p.id)) || Object.values(e.formacao.ativos).some(a=>a&&a.id===p.id);
      const status=atual>=3?'Formação concluída':emFila?'Na fila ou em treinamento': 'Aguardando matrícula';
      return card(`${p.nome} · ${p.id}`,`${linha('Etapa',atual>=3?'Pronto para integração':etapas[atual])}${linha('Situação',status)}
      <div class="exp-barra"><i style="width:${Math.min(100,atual/3*100)}%"></i></div>
      <p class="exp-muted">${atual}/3 módulos concluídos</p>
      <button data-integrar="${p.id}" ${atual<3?'disabled':''}>Integrar ao efetivo</button>`);
    }).join('');
    return card('Efetivo',`${linha('Policiais e comandante',policiais)}${linha('Recrutas',recrutas.length)}${linha('Funcionários totais',e.funcionarios.length)}<p class="exp-muted">O inspetor acompanha o treino de armas, o comandante conduz o estudo do manual e o sargento supervisiona o treino físico. Só um recruta entra por sala; os demais aguardam em fila do lado de fora da porta.</p><p class="exp-muted">Para iniciar uma rodada, acesse Análises e selecione ‘Iniciar treinamento’.</p>`) +
      card('Instrutores e filas',ativos+'<hr>'+fila)+
      (lista || card('Academia','Não há recrutas em formação.'));
  }
  function renderBairros(e) {
    return Object.entries(e.bairros).map(([nome,b])=>card(nome,`${linha('Índice de segurança',b.seguranca+'/100')}${linha('Movimento urbano',b.atividade+'/100')}${linha('Ocorrências atendidas',b.atendimentos)}
      <div class="exp-barra"><i style="width:${b.seguranca}%"></i></div><p class="exp-muted">O índice é uma representação gerencial do bairro e muda conforme o desempenho da unidade.</p>`)).join('');
  }
  function renderRelatorios(e) {
    const v=e.viaturas, emPatrulha=v.filter(x=>x.estado==='Em patrulha'||x.estado==='Despachada'||x.estado==='No local').length;
    const ativos=e.ocorrencias.filter(o=>o.estado==='aberta'||o.estado==='despachada').length;
    const recentes=e.historicoGeral.slice(0,12).map(x=>`<div class="exp-linha"><span>${x.texto}</span><small>${Math.floor(x.tempo)}s</small></div>`).join('')||'Nenhum registro ainda.';
    const emTreino=!!e.formacao.rodando||Object.values(e.formacao.ativos).some(Boolean)||Object.values(e.formacao.filas).some(q=>q.length);
    const elegiveis=e.funcionarios.filter(p=>ehTrein(p)&&(p.moduloTreino||0)<3&&!p.fora&&!p.embarcando&&!p.ferido&&!e.viaturas.some(v=>(v.equipe||[]).includes(p.id)&&['Em patrulha','Despachada','No local','Preparando saída','Retornando'].includes(v.estado)));
    return card('Resumo operacional',`${linha('Saldo disponível',dinheiro(e.dinheiro))}${linha('Receitas acumuladas',dinheiro(e.receitas))}${linha('Despesas acumuladas',dinheiro(e.despesas))}${linha('Ocorrências ativas',ativos)}${linha('Viaturas em atividade',emPatrulha)}${linha('Prisões registradas',e.stats.presos)}${linha('Fugas',e.stats.fugiram)}${linha('Ocorrências expiradas',e.stats.expiradas)}${linha('Reputação',e.reputacao+'/100')}`)+
      card('Treinamento de oficiais',`${linha('Oficiais P1 aptos a iniciar',elegiveis.length)}${linha('Estado do treinamento',emTreino?'Em andamento':'Aguardando início')}<p class="exp-muted">Ao iniciar, os recrutas disponíveis formam uma fila do lado de fora da sala de armas. Apenas um entra por vez e segue automaticamente para o manual e depois para o treino físico. Quem estiver patrulhando, embarcando ou atendendo ocorrência fica de fora.</p><button data-iniciar-treinamento="1" ${emTreino||!elegiveis.length?'disabled':''}>Iniciar treinamento</button>`)+
      card('Registro de atividades',recentes);
  }
  function render() {
    const e=PT.estado; if(!e)return; preparar(e);
    conteudo.innerHTML = aba==='instalacoes'?renderInstalacoes(e):
      aba==='frota'?renderFrota(e):aba==='equipe'?renderEquipe(e):
      aba==='bairros'?renderBairros(e):renderRelatorios(e);
  }
  function atribuirEquipe(v,e) {
    v.equipe = Array.isArray(v.equipe) ? v.equipe : []; if (e.formacao && e.formacao.rodando) v.equipe = v.equipe.filter(id => !(e.formacao.instrutores || []).includes(id));
    const usados = new Set(e.viaturas.filter(q=>q!==v).flatMap(q=>q.equipe||[]));
    const livres = e.funcionarios.filter(p =>
      p.tipo==='funcionario' && p.funcao==='Policial' && !p.fora && !p.embarcando && !p.treinoSala && !p.ferido && !(e.formacao&&e.formacao.rodando&&(e.formacao.instrutores||[]).includes(p.id)) &&
      !usados.has(p.id) && !(v.equipe||[]).includes(p.id)
    );
    // Cada viatura recebe até dois policiais disponíveis.
    while(v.equipe.length<2 && livres.length) v.equipe.push(livres.shift().id);
    return v.equipe.length;
  }
  function acao(btn) {
    const e=PT.estado; preparar(e);
    if(btn.dataset.melhorar) {
      const k=btn.dataset.melhorar,c=custoMelhoria(e,k);
      if(!Financeiro.gastar(e,c,'Melhoria: '+nomesSalas[k])) return aviso('Saldo insuficiente para essa melhoria.');
      e.melhorias[k]++;
      if(k==='prisao') e.celas+=5;
      registrar(e,`${nomesSalas[k]} melhorada para o nível ${e.melhorias[k]}.`);
      aviso(`${nomesSalas[k]} melhorada!`);
    } else if(btn.dataset.comprarViatura) {
      const modelos={sedan:['Sedan policial',12000],suv:['SUV policial',16500],van:['Van de apoio',19000],pickup:['Picape',17500],moto:['Motopatrulha',9500]};
      const modelo=btn.dataset.comprarViatura, dados=modelos[modelo];
      if(!dados) return;
      const custo=dados[1];
      if(!Financeiro.gastar(e,custo,'Compra de '+dados[0])) return aviso('Saldo insuficiente.');
      const n=e.proximaViatura++;
      const id='VTR-'+String(n).padStart(2,'0');
      const nova={id,modelo,nomeModelo:dados[0],estado:'Disponível',manutencao:100,equipe:[],p:0,patrulhas:0,hist:[],px:25.5,py:13.5,rota:null,idx:0,t:0,ang:0};
      e.viaturas.push(nova);
      atribuirEquipe(nova,e);
      registrar(e,'Nova viatura adquirida: '+id+' ('+dados[0]+')');
      aviso(dados[0]+' adicionada à frota.');
    } else if(btn.dataset.patrulha) {
      const v=e.viaturas.find(x=>x.id===btn.dataset.patrulha);
      if(v&&v.estado==='Disponível'&&v.manutencao>=20){Cidade.patrulhar(v);registrar(e,v.id+' iniciou uma patrulha.');}
    } else if(btn.dataset.patrulhaFabril) {
      const v=e.viaturas.find(x=>x.id===btn.dataset.patrulhaFabril);
      if(v&&v.estado==='Disponível'&&v.manutencao>=20){Cidade.patrulharBairro(v,'Distrito Fabril');registrar(e,v.id+' iniciou patrulha direcionada no Distrito Fabril.');}
    } else if(btn.dataset.recolher) {
      const v=e.viaturas.find(x=>x.id===btn.dataset.recolher);
      if(v&&v.estado==='Em patrulha'){v.bairroPatrulha=null;v.estado='Retornando';v.hist.unshift('Ordem de recolhimento');}
    } else if(btn.dataset.manter) {
      const v=e.viaturas.find(x=>x.id===btn.dataset.manter);
      if(v&&Financeiro.gastar(e,400,'Manutenção '+v.id)){v.manutencao=100;v.hist.unshift('Manutenção realizada');}
      else aviso('Não foi possível pagar a manutenção.');
    } else if(btn.dataset.contratar) {
      const recep=btn.dataset.contratar==='recepcionista', custo=recep?1200:1800;
      if(!Financeiro.gastar(e,custo,'Contratação de '+(recep?'recepcionista':'policial'))) return aviso('Saldo insuficiente.');
      const n=e.proximoFuncionario++, id='PT-'+String(5+n).padStart(3,'0');
      const nome=recep?'Recepcionista '+n:'Policial '+n, funcao=recep?'Recepcionista':'Policial';
      const p={id,nome,funcao,tipo:'funcionario',casa:recep?'recepcao':'garagem',situacao:'Em serviço',etapa:0,ph:n*2.13,path:[],espera:3,fora:false,local:'',atividade:'',x:recep?3:14,y:recep?3:10,dest:recep?'recepcao':'garagem'};
      e.funcionarios.push(p);registrar(e,nome+' contratado(a).');aviso(nome+' contratado(a).');
    } else if(btn.dataset.iniciarTreinamento) {
      const jaAtivo=!!e.formacao.rodando||Object.values(e.formacao.ativos).some(Boolean)||Object.values(e.formacao.filas).some(q=>q.length);
      if(jaAtivo) return aviso('Já existe uma rodada de treinamento em andamento.');
      const livres=e.funcionarios.filter(p=>ehTrein(p)&&(p.moduloTreino||0)<3&&!p.fora&&!p.embarcando&&!p.ferido&&!e.viaturas.some(v=>(v.equipe||[]).includes(p.id)&&['Em patrulha','Despachada','No local','Preparando saída','Retornando'].includes(v.estado)));
      if (!livres.length) return aviso('Não há oficiais P1 disponíveis para treinamento.');
      e.formacao.rodando=true;
      e.formacao.instrutores=['PT-003','PT-001','PT-002'];
      e.formacao.filas={armas:[],manual:[],luta:[]};
      e.formacao.ativos={armas:null,manual:null,luta:null};
      livres.forEach(p=>{p.moduloTreino=0;p.treinoSala='treinoArmas';p.treinoAnim=null;p.treinoPapel='fila';p.treinoFilaEtapa='armas';p.atividade='Aguardando na fila do treino de armas';e.formacao.filas.armas.push(p.id);});
      organizarFila(e,'armas');
      prepararInstrutor(e,'PT-003','armas');
      prepararInstrutor(e,'PT-001','manual');
      prepararInstrutor(e,'PT-002','luta');
      registrar(e,livres.length+' oficial(is) iniciaram uma nova rodada de formação.');
      aviso(livres.length+' oficial(is) entraram na fila do treino de armas.');
    } else if(btn.dataset.integrar) {
      const id=btn.dataset.integrar,p=e.funcionarios.find(x=>x.id===id);
      if(p&&p.tipo==='recruta'&&p.etapa>=5&&!e.treinamentos[id]){
        p.tipo='funcionario';p.funcao='Policial';p.situacao='Policial formado';p.casa='alojamento';
        p.x=3;p.y=10;p.path=[];p.dest='alojamento';
        registrar(e,p.nome+' concluiu a formação e entrou no efetivo.');
        aviso(p.nome+' integrado ao efetivo!');
      }
    }
    render();atualizarHud();
  }
  conteudo.addEventListener('click',ev=>{const b=ev.target.closest('button');if(b)acao(b);});
  document.querySelectorAll('[data-exp]').forEach(b=>b.addEventListener('click',()=>abrir(b.dataset.exp)));
  $('#exp-fechar').addEventListener('click',fechar); fundo.addEventListener('click',fechar);
  document.addEventListener('keydown',ev=>{if(ev.key==='Escape')fechar();});

  // Formação em fluxo: um aluno por sala; os demais aguardam do lado de fora da porta.
  const modulosTreino = [
    {key:'armas',room:'treinoArmas',trainer:'PT-003',nome:'Treino de armas',duracao:10,posto:{x:24.45,y:4.45},posInstrutor:{x:26.45,y:4.35}},
    {key:'manual',room:'treinoManual',trainer:'PT-001',nome:'Treino do manual',duracao:10,posto:{x:29.45,y:4.0},posInstrutor:{x:31.15,y:4.0}},
    {key:'luta',room:'treinoLuta',trainer:'PT-002',nome:'Treino físico',duracao:10,posto:{x:26.85,y:10.45},posInstrutor:{x:28.15,y:10.45}}
  ];
  const etapaPorChave = key => modulosTreino.find(x=>x.key===key);
  function salaDe(p) {
    for (const [key,r] of Object.entries(Delegacia.R)) if (p.x>=r.x && p.x<r.x+r.w && p.y>=r.y && p.y<r.y+r.h) return key;

  function caminhoParaPonto(p, etapa, alvo, dentro) {

<script>
(() => {
  'use strict';
  const caminho = Cidade.caminho, BASE = { x: 25.5, y: 13.5 };
  const PATR = [BASE, { x: 42.5, y: 13.5 }, { x: 42.5, y: 30.5 }, { x: 15.5, y: 30.5 }, { x: 15.5, y: 13.5 }, BASE];

  };

    v.estado = 'Preparando saída'; v.equipe = crew.slice(); v.rota = null; v.idx = 0; v.saida = Object.assign({ tipo, t: 0, fase: 'embarque' }, o || {}); v.animacaoSaida = { fase: 'embarque', t: 0, tipo };
    const s = slotV(e, v);

  }

  }
  function etapa(v, e, dt) {

  Cidade.atualizar = (dt, e) => {

    const e = PT.estado; if (!e || e.saldoAjuste200 === true) return; e.saldoAjuste200 = true;
    if (e.dinheiro < 200000) { const d = 200000 - e.dinheiro; e.dinheiro = 200000; (e.lancamentos = e.lancamentos || []).unshift({ tipo: 'receita', valor: d, motivo: 'Ajuste de saldo (R$ 200 mil)' }); avisar('💰 Saldo ajustado para R$ 200.000.'); }
  }
  // Botão de recuperação no painel (aba Save), com confirmação em dois toques.
  let conf = 0;
  document.addEventListener('click', ev => {
    const b = ev.target.closest('[data-ext="saldo"]'), e = PT.estado; if (!b || !e) return;
    if (Date.now() - conf > 4000) { conf = Date.now(); avisar('Toque de novo em até 4 segundos para definir o saldo em R$ 200.000.'); return; }
    conf = 0; const d = 200000 - e.dinheiro; e.dinheiro = 200000; (e.lancamentos = e.lancamentos || []).unshift({ tipo: d >= 0 ? 'receita' : 'despesa', valor: Math.abs(d), motivo: 'Saldo definido manualmente (R$ 200 mil)' }); avisar('💰 Saldo definido em R$ 200.000.');
  }, true);
  setInterval(() => { treinoAuto(); saldo(); }, 1000);
})();

</script>
<script>
(() => {
  'use strict';
  // No máximo 1 tiroteio aberto por vez (2 durante uma guerra de gangues).
  const limiteTiros = e => 1 + (e.guerra ? 1 : 0);
  const abertos = e => e.ocorrencias.filter(o => o.tiroteio).length;
  const opsLivres = e => e.funcionarios.filter(p => p.funcao === 'Operador BOPE' && !p.bopeFora && !p.ferido && !p.treinoSala && !p.rebAcao).length;
  window.__limiteTiros = limiteTiros;
  // Retaliação no Distrito Fabril: só depois de 3 voltas, com intervalo de 5 a 9 minutos,
  // só se o BOPE existe e tem operadores livres, e nunca acima do limite de tiroteios abertos.
  window.__podeRetaliar = (e, v) => {
    v.voltasFabril = (v.voltasFabril || 0) + 1;
    if (v.voltasFabril < 3 || e.tempo < (e.proxRetaliacao || 0)) return false;
    if (!(e.salas && e.salas.bope) || opsLivres(e) < 3) return false;
    if (abertos(e) >= limiteTiros(e)) return false;
    if (Math.random() > 0.35) return false;
    e.proxRetaliacao = e.tempo + 300 + Math.random() * 240; v.voltasFabril = 0; return true;
  };
  // Rede de segurança: se um save antigo tiver tiroteios demais abertos, remove o excesso sem punir.
  const au = Cidade.atualizar.bind(Cidade); let ult = 0;
  Cidade.atualizar = (dt, e) => {
    au(dt, e); if (e.tempo - ult < 1) return; ult = e.tempo;
    const lim = limiteTiros(e), total = abertos(e); if (total <= lim) return;
    const extra = e.ocorrencias.filter(o => o.tiroteio && o.estado === 'aberta' && !o.cav).sort((a, b) => b.criado - a.criado).slice(0, total - lim);
    if (!extra.length) return;
    const ids = new Set(extra.map(o => o.id)); e.ocorrencias = e.ocorrencias.filter(o => !ids.has(o.id)); for (const t of (e.tiros || [])) if (ids.has(t.id)) t.res = true;
  };
})();

</script>
<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s), brl = U.brl;
  const aviso = m => { const t = $('#toast'); if (!t) return; t.textContent = m; t.classList.add('on'); if (window.__log) window.__log(m); setTimeout(() => t.classList.remove('on'), 2600); };
  // Progressão independente: a patente SGT é conquistada por avaliação, não por sorteio.
  const BANCO_SGT = [
    {q:'Um cidadão apresenta uma reclamação formal contra um integrante da equipe. Qual é a postura adequada do sargento?',o:['Ignorar para evitar desgaste','Registrar a reclamação e encaminhar para apuração imparcial','Prometer punição antes de verificar os fatos','Apagar o registro'],c:1},
    {q:'Dois oficiais discordam durante o serviço. O que o sargento deve priorizar?',o:['Aumentar o conflito','Escolher um lado sem ouvir ninguém','Ouvir os envolvidos e orientar uma solução profissional','Deixar a equipe sem orientação'],c:2},
    {q:'Uma informação importante de uma ocorrência ainda não foi confirmada. Como deve ser comunicada?',o:['Como certeza absoluta','Com detalhes inventados para completar o relatório','Somente por boatos','Como informação pendente de confirmação'],c:3},
    {q:'Qual é uma responsabilidade central de quem lidera uma equipe?',o:['Acompanhar o trabalho, orientar e cobrar conduta profissional','Fazer todas as tarefas sozinho','Evitar prestar contas','Favorecer os amigos'],c:0},
    {q:'Um subordinado comete um erro e relata o ocorrido espontaneamente. Qual é a melhor primeira atitude?',o:['Esconder o erro','Ouvir o relato, preservar os registros e seguir o procedimento adequado','Punir sem entender o que aconteceu','Mandar apagar as evidências'],c:1},
    {q:'Por que um relatório de serviço deve ser claro e objetivo?',o:['Para dificultar a leitura','Para substituir a investigação','Para permitir compreensão e verificação dos fatos','Para esconder incertezas'],c:2},
    {q:'Um superior solicita que você altere um registro para esconder um erro. O que fazer?',o:['Cumprir sem questionar','Apagar o registro original','Pedir recompensa','Recusar a alteração indevida e comunicar pelos canais apropriados'],c:3},
    {q:'Durante uma ocorrência, a equipe recebe informações contraditórias. O que o sargento deve fazer?',o:['Verificar as informações e orientar a equipe com clareza','Escolher a versão mais conveniente','Divulgar todas como verdadeiras','Encerrar o registro'],c:0},
    {q:'Como deve ser tratada uma pessoa sob custódia?',o:['Com humilhação para impor respeito','Com tratamento digno e respeito aos procedimentos','Sem registro de seus dados','De acordo com a opinião pessoal do oficial'],c:1},
    {q:'O que demonstra uma boa liderança?',o:['Nunca aceitar perguntas','Transferir toda responsabilidade aos subordinados','Dar exemplo, manter a disciplina e assumir responsabilidades','Evitar orientar a equipe'],c:2}
  ];
  const embaralhar = arr => { const a = arr.slice(); for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const avSgt = (e,m) => { e.avisos = e.avisos || []; e.avisos.push(m); };
  window.__criarProvaSgt = (e,p) => {
    p.sgtTeste = {perguntas:embaralhar(BANCO_SGT.map((_,i)=>i)).slice(0,5),atual:0,acertos:0,total:5,inicio:e.tempo};
    p.treinoSala=null; p.treinoAnim=null; p.treinoPapel=null; p.atividade='Realizando prova de sargento'; p.espera=2;
    return true;
  };
  window.__responderSgt = (e,p,resposta) => {
    const t=p && p.sgtTeste; if(!t || !Number.isInteger(resposta)) return;
    const q=BANCO_SGT[t.perguntas[t.atual]]; if(!q) return;
    const acertou=resposta===q.c; if(acertou) t.acertos++;
    t.ultima=acertou?'Resposta correta.':'Resposta incorreta.'; t.atual++;
    if(t.atual>=t.total){
      const total=t.acertos, aprovado=total>=4;
      p.sgtTeste=null; p.sgtProvaResultado={acertos:total,total:5,aprovado,tempo:e.tempo};
      if(aprovado){p.patente='SGT';p.situacao='Sargento';p.sgtDesde=e.tempo;avSgt(e,'🎖 '+p.nome+' foi aprovado na prova e agora é Sargento! A patente não define a corporação.');}
      else avSgt(e,'❌ '+p.nome+' não atingiu a nota mínima ('+total+'/5). Continua P2 e poderá tentar novamente.');
    }
  };
  // Sargento que permanece na polícia supervisiona a corporação.
  window.__supervisao = e => e.funcionarios.some(p => p.patente === 'SGT' && p.funcao === 'Policial' && !p.fora && !p.ferido);
  window.__sgtCard = e => {
    const lin=(a,b)=>'<div class="exp-linha"><span>'+a+'</span><b>'+b+'</b></div>';
    const p2=e.funcionarios.filter(p=>window.__elegP2&&window.__elegP2(p)), emTeste=e.funcionarios.find(p=>p.sgtTeste);
    const sgts=e.funcionarios.filter(p=>p.patente==='SGT');
    const gLivre=!!(e.salas&&e.salas.gcm&&e.gcm&&!e.gcm.sargento), bLivre=!!(window.__bopeLivre&&window.__bopeLivre(e));
    let h='<section class="exp-card"><h3>🎖 Progressão para sargento</h3>'+lin('Custo da prova',brl(800))+lin('Formato','5 perguntas · mínimo de 4 acertos');
    h+='<p class="exp-muted">A promoção é uma qualificação profissional. O aprovado continua na função atual e só muda de corporação se você decidir transferi-lo. A prova aborda liderança, ética, comunicação e procedimentos.</p>';
    if(emTeste){
      const t=emTeste.sgtTeste, q=BANCO_SGT[t.perguntas[t.atual]];
      h+='<h3 style="margin-top:8px">Prova em andamento · '+(t.atual+1)+'/5</h3>'+lin('Candidato',emTeste.nome)+lin('Pontuação',t.acertos+' acerto(s)')+(t.ultima?'<p class="exp-muted">'+t.ultima+'</p>':'');
      if(q){h+='<p><b>'+q.q+'</b></p>'+q.o.map((op,i)=>'<button style="display:block;width:100%;text-align:left;margin:5px 0;white-space:normal" data-rec="sgt-resposta" data-id="'+emTeste.id+'" data-answer="'+i+'">'+String.fromCharCode(65+i)+') '+op+'</button>').join('');}
    } else {
      const ultimo=e.funcionarios.filter(p=>p.sgtProvaResultado).sort((a,b)=>b.sgtProvaResultado.tempo-a.sgtProvaResultado.tempo)[0];
      if(ultimo){const r=ultimo.sgtProvaResultado;h+='<p class="exp-muted">Último resultado: '+ultimo.nome+' — '+r.acertos+'/5 — '+(r.aprovado?'aprovado':'não aprovado')+'.</p>';}
      h+=p2.length?p2.map(p=>'<div class="exp-linha"><span>'+p.nome+' · P2</span><button data-rec="sgt" data-id="'+p.id+'">'+window.__rot(p,e,'Iniciar prova')+'</button></div>').join(''):'<p>Nenhum oficial P2 elegível no momento.</p>';
    }
    if(sgts.length) h+='<h3 style="margin-top:10px">Sargentos aprovados</h3>'+sgts.map(p=>{
      if(p.funcao==='Sargento GCM')return lin(p.nome,'comanda a GCM');
      if(p.funcao==='Sargento BOPE')return lin(p.nome,'comanda o BOPE');
      return '<div class="exp-linha"><span>'+p.nome+' · na polícia</span><span>'+(gLivre?'<button data-rec="sgtgcm" data-id="'+p.id+'">À GCM</button>':'')+(bLivre?'<button data-rec="sgtbope" data-id="'+p.id+'">Ao BOPE</button>':'')+'</span></div>';
    }).join('');
    h+='<p class="exp-muted">Um sargento que permanece na polícia supervisiona as equipes, reduzindo em 15% o risco de ferimentos e mortes durante o serviço. Sargentos não são enviados em missões comuns.</p>';
    return h+'</section>';
  };
  document.addEventListener('click', ev => {
    const b=ev.target.closest('[data-rec="sgt"],[data-rec="sgtgcm"],[data-rec="sgtbope"]'),e=PT.estado;if(!b||!e)return;
    const p=e.funcionarios.find(x=>x.id===b.dataset.id);if(!p)return;const a=b.dataset.rec;
    if(a==='sgt'){if(window.__testarSgt)window.__testarSgt(e,p.id);}
    else if(a==='sgtgcm'){if(e.gcm&&!e.gcm.sargento&&p.funcao==='Policial'){e.gcm.sargento=p.id;p.funcao='Sargento GCM';p.casa='gcm';p.situacao='Sargento da GCM';p.espera=2;Delegacia.irPara(p,'gcm');avisar('🎖 '+p.nome+' agora comanda a GCM.');}}
    else if(a==='sgtbope'){if(window.__atribuirSgtBope&&p.funcao==='Policial')window.__atribuirSgtBope(e,p);}
  });
})();

</script>
